name = "loop-gallery-space"
compatibility_date = "2025-04-01"
main = ".output/server/index.mjs"

[[d1_databases]]
binding = "loopgallery-db"
database_name = "loopgallery-db"
database_id = "9c338118-ec94-41bc-90d1-f58f1bde24c9"
migrations_dir = "server/database/migrations"

[[r2_buckets]]
binding = "loopgallery-media"
bucket_name = "loopgallery-media"

# Non-secret runtime vars (also set as Build variables for NUXT_PUBLIC_* during npm run build).
# Secrets (R2_ACCESS_KEY_ID, etc.) must use: wrangler secret put NAME
# Do not leave [vars] empty — deploy merges generated wrangler.json and can wipe dashboard-only vars.
[vars]
NUXT_PUBLIC_GALLERY_HOST = "loopgallery.a-u.us"
NUXT_PUBLIC_SITE_URL = "https://loopgallery.a-u.us"
